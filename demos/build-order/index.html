<body>
  <a class="skip-link" href="#order">Skip to the order</a>
  <div class="page-shell">
    <header class="site-header" data-header>
      <div class="container nav-row">
        <a class="brand-mark" href="../../" aria-label="Acor.dev home">
          <img src="../../rsc/img/acor_transparent.png" alt="">
          <span>Acor.dev</span>

          <a href="../../evidence/">Evidence</a>

      </div>

    <main class="section" id="order">
      <div class="container walk">
        <div class="walk-top">
          <p class="eyebrow">One order</p>
          <h1>Build an order. Watch it become production.</h1>
          <p class="walk-qty" data-qty>Nothing selected</p>
        </div>

          <aside class="walk-order" aria-label="Cabinets">

            <p class="walk-step" data-step-label>Choose the cabinets</p>
            <div data-view></div>
            <div class="walk-nav">
              <button type="button" data-back disabled>Back</button>
              <button type="button" data-next>Next</button>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>
  <script src="../../script.js"></script>
