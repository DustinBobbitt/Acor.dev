        <p class="eyebrow">Morning papers</p>

          <div class="app-bar"><strong data-date>July 14</strong><button class="app-btn" type="button" data-act="reset">Reset day</button></div>

                <table class="app-table" data-jobs></table>
              </section>
              <section>
                <h2>Build line still needs</h2>
                <div data-pull></div>
                <h2 style="margin-top:1rem">Batch already formed</h2>
                <p data-batch></p>
              </section>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="../../script.js"></script>
  <script src="../shared/shop.js"></script>
