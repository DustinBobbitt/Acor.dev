<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cut Pallet Locator | Acor.dev</title>
  <meta name="description" content="Cut Pallet Locator on an invented floor: Upcoming, Gone, Find pallet, Place, Walk, and Undo.">
  <link rel="canonical" href="https://acor.dev/demos/pallet/">
  <link rel="icon" type="image/png" sizes="32x32" href="../../rsc/img/acor_favicon_32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=20261108s">
  <link rel="stylesheet" href="../shared/apps.css?v=20261108s">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="page-shell">
    <header class="site-header" data-header>
      <div class="container nav-row">
        <a class="brand-mark" href="../../" aria-label="Acor.dev home"><img src="../../rsc/img/acor_transparent.png" alt=""><span>Acor.dev</span></a>
        <nav class="site-nav" aria-label="Primary navigation"><a href="../../#apps">Apps</a><a href="../cut/">Cut</a><a href="../../evidence/">Evidence</a></nav>
      </div>
    </header>
    <main class="section app-page" id="main-content">
      <div class="container">
        <p class="eyebrow">July 14 · invented floor</p>
        <h1>Cut Pallet Locator</h1>
        <div class="app-frame" data-app>
          <div class="app-bar"><strong>Cut Pallet Locator</strong><span>Upcoming · Gone · Walk · Undo</span></div>
          <div class="app-body">
            <aside class="app-side">
              <div class="segment" data-tabs>
                <button type="button" data-act="tab" data-tab="upcoming">Upcoming</button>
                <button type="button" data-act="tab" data-tab="gone">Gone</button>
              </div>
              <label class="app-quiet" for="find">Find pallet</label>
              <input id="find" data-find style="width:100%;margin:0.4rem 0;padding:0.4rem;border:1px solid #cfc6b8;border-radius:8px;font:inherit">
              <div data-list></div>
              <div class="app-actions" style="margin-top:0.7rem">
                <button class="app-btn" type="button" data-act="undo">Undo</button>
                <button class="app-btn" type="button" data-act="walk">Walk</button>
                <button class="app-btn" type="button" data-act="reset">Reset day</button>
              </div>
              <p data-walk class="app-quiet"></p>
            </aside>
            <section class="app-main">
              <h2>Place</h2>
              <div class="map-grid" data-map></div>
            </section>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="../../script.js"></script>
  <script src="../shared/shop.js"></script>
  <script src="pallet.js"></script>
</body>
</html>
