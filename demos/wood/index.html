<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wood Usage | Acor.dev</title>
  <meta name="description" content="Wood Usage for the invented shop day: upcoming sheets and hours. No prices.">
  <link rel="canonical" href="https://acor.dev/demos/wood/">
  <link rel="icon" type="image/png" sizes="32x32" href="../../rsc/img/acor_favicon_32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=20261108s">
  <link rel="stylesheet" href="../shared/apps.css?v=20261108s">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="page-shell">
    <header class="site-header" data-header>
      <div class="container nav-row">
        <a class="brand-mark" href="../../" aria-label="Acor.dev home"><img src="../../rsc/img/acor_transparent.png" alt=""><span>Acor.dev</span></a>
        <nav class="site-nav" aria-label="Primary navigation"><a href="../../#apps">Apps</a><a href="../pricing/">Pricing</a><a href="../../evidence/">Evidence</a></nav>
      </div>
    </header>
    <main class="section app-page" id="main-content">
      <div class="container">
        <p class="eyebrow">Purchasing and hours</p>
        <h1>Wood Usage</h1>
        <div class="app-frame" data-app>
          <div class="app-bar"><strong>Wood Usage</strong><span data-source></span></div>
          <div class="app-main">
            <p data-totals style="font-family:'Space Grotesk',sans-serif;font-size:1.4rem"></p>
            <table class="app-table" data-jobs></table>
            <p class="app-note">Recent pace sets the hours. It does not change the cost standard. Not a scheduler.</p>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="../../script.js"></script>
  <script src="../shared/shop.js"></script>
  <script>
    AcorShop.open(function (shop) {
      var day = shop.day;
      document.querySelector("[data-source]").textContent = day.forecast.source;
      document.querySelector("[data-totals]").textContent = day.forecast.sheets + " sheets · " + day.forecast.hours + " hours";
      document.querySelector("[data-jobs]").innerHTML = "<tr><th>Job</th><th>Cabinets</th><th>Sheets</th><th>Hours</th></tr>" + day.jobs.map(function (job) {
        return "<tr><td>" + job.id + "</td><td>" + job.cabinets + "</td><td>" + job.sheets + "</td><td>" + job.hours + "</td></tr>";
      }).join("");
    });
  </script>
</body>
</html>
