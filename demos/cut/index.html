<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cut Department | Acor.dev</title>
  <meta name="description" content="Cut Department for the invented July 14 day. Smart Batch, jobs by date, live batches, and walk-up.">
  <link rel="canonical" href="https://acor.dev/demos/cut/">
  <link rel="icon" type="image/png" sizes="32x32" href="../../rsc/img/acor_favicon_32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=20261108u">
  <link rel="stylesheet" href="../shared/apps.css?v=20261108u">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="page-shell">
    <header class="site-header" data-header>
      <div class="container nav-row">
        <a class="brand-mark" href="../../" aria-label="Acor.dev home"><img src="../../rsc/img/acor_transparent.png" alt=""><span>Acor.dev</span></a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="../../#apps">Apps</a>
          <a href="../station/">Station</a>
          <a href="../../evidence/">Evidence</a>
        </nav>
      </div>
    </header>
    <main class="section app-page" id="main-content">
      <div class="container">
        <h1>Cut Department</h1>
        <div class="app-frame" data-app>
          <div class="app-bar">
            <strong>Cut Department</strong>
            <span data-share>Share connected</span>
            <div class="app-actions">
              <button class="app-btn" type="button" data-act="walkup">Walk-up</button>
              <button class="app-btn" type="button" data-act="share">Share</button>
              <button class="app-btn" type="button" data-act="reset">Reset day</button>
            </div>
          </div>
          <div class="app-main">
            <div class="split">
              <section>
                <h2>Smart Batch</h2>
                <p data-summary></p>
                <button class="app-btn primary" type="button" data-act="assign">Produce and assign</button>
                <p class="app-quiet">Held from stations until assigned. Bottoms stay on the router.</p>
                <div class="folder" data-folder hidden></div>
                <h2 style="margin-top:1rem">Jobs by date</h2>
                <table class="app-table" data-jobs></table>
                <h2 style="margin-top:1rem">Still for the saw</h2>
                <table class="app-table" data-saw></table>
              </section>
              <section>
                <h2>Live batches</h2>
                <div data-lanes></div>
              </section>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="../../script.js"></script>
  <script src="../shared/shop.js"></script>
  <script src="cut.js?v=20261108u"></script>
</body>
</html>
