  <div class="page-shell">
    <header class="site-header" data-header>
      <div class="container nav-row">
        <a class="brand-mark" href="../../" aria-label="Acor.dev home"><img src="../../rsc/img/acor_transparent.png" alt=""><span>Acor.dev</span></a>
        <nav class="site-nav" aria-label="Primary navigation"><a href="../../#apps">Apps</a><a href="../cut/">Cut desktop</a><a href="../../evidence/">Evidence</a></nav>
      </div>

    <main class="section app-page" id="main-content">
      <div class="container">
        <p class="eyebrow">When the network is down</p>
        <h1>Department status</h1>
        <div class="app-frame" data-app>
          <div class="app-bar">
            <strong>Shop Floor Orchestrator</strong>
            <div class="segment">
              <button type="button" data-act="view" data-view="rotation">Rotation</button>
              <button type="button" data-act="view" data-view="floor">Department</button>
            </div>
          </div>
          <div class="app-main">
            <p data-summary></p>
            <div data-panel></div>
            <div class="app-actions" style="margin-top:0.8rem">
              <button class="app-btn" type="button" data-act="push">Push</button>
              <button class="app-btn" type="button" data-act="pull">Pull</button>
              <button class="app-btn primary" type="button" data-act="advance">Advance round</button>
              <button class="app-btn" type="button" data-act="move">Advance one item</button>
              <button class="app-btn" type="button" data-act="conflict">Record a conflict</button>
              <button class="app-btn" type="button" data-act="reset">Reset day</button>
            </div>
            <h2 style="margin-top:1rem">Reconciliation queue</h2>
            <div data-recovery></div>
          </div>
        </div>
      </div>
    </main>
